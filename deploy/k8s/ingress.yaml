apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: 47.98.20.61    # 替换成你的域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume
                port:
                  number: 80